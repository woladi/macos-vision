name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync package.json version from latest git tag
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$LATEST" ]; then
            VERSION="${LATEST#v}"
            echo "Syncing package.json to $VERSION (from tag $LATEST)"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            echo "No existing version tags found, keeping package.json version"
          fi

      - name: Fix package.json for npm publish
        run: npm pkg fix

      - name: Upgrade npm and configure for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          npm config delete //registry.npmjs.org/:_authToken
          echo "OIDC URL set: $([[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]] && echo yes || echo no)"

      - name: Release
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
