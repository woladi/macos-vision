name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Check if release is needed
        id: bump_check
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag — releasing initial version"
            exit 0
          fi
          if git log "$LAST_TAG..HEAD" --format=%B | grep -qE '^(feat|fix)(\(.+\))?!?: |BREAKING CHANGE'; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Found bumping commits since $LAST_TAG"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix/BREAKING commits since $LAST_TAG — skipping release"
          fi

      - name: Configure git
        if: steps.bump_check.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fix package.json for npm publish
        if: steps.bump_check.outputs.release_needed == 'true'
        run: npm pkg fix

      - name: Release
        if: steps.bump_check.outputs.release_needed == 'true'
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
